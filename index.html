<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>아이엠파인SD팀 지원자 박찬정</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1>아이엠파인SD팀 지원자 박찬정</h1>
    <div class="bar-container">
      <div class="value-100">100</div>
      <div class="value-0">0</div>
      <div id="barChart" class="bar-chart"></div>
    </div>
    <h2>값 편집</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Value</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="editTableBody"></tbody>
    </table>
    <button onclick="applyEdits()">Apply</button>

    <h2>값 추가</h2>
    <div class="addContainer">
      <input type="text" id="newId" placeholder="Enter ID" />
      <input type="number" id="newValue" placeholder="Enter Value" />
      <button onclick="addItem()">Add</button>
    </div>

    <h2>값 고급 편집</h2>
    <textarea
      id="jsonEditor"
      rows="10"
      placeholder='[{"id":0,"value":75}]'></textarea
    ><br />
    <button onclick="applyJson()">Apply JSON</button>
    <script src="main.js"></script>
  </body>
</html>
